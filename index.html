<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Info</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-hover: #263449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 3rem 1.5rem;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.75rem; margin: 0 0 0.25rem; }
  .subtitle { color: var(--muted); margin: 0 0 2.5rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1rem;
  }
  a.card {
    display: block;
    padding: 1.5rem;
    border-radius: 14px;
    background: var(--card);
    color: var(--text);
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.06);
    transition: background 0.15s ease, transform 0.15s ease;
  }
  a.card:hover { background: var(--card-hover); transform: translateY(-2px); }
  a.card .icon { font-size: 1.5rem; margin-bottom: 0.5rem; display: block; }
  a.card .name { font-weight: 600; font-size: 1.05rem; }
  a.card .desc { color: var(--muted); font-size: 0.875rem; margin-top: 0.25rem; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Info</h1>
    <p class="subtitle">Panel de acceso a dashboards y paneles publicados.</p>
    <div class="grid">
      <a class="card" href="meta/">
        <span class="icon">📊</span>
        <span class="name">Meta Ads</span>
        <span class="desc">Panel de campañas Eddis</span>
      </a>
    </div>
  </div>
</body>
</html>
